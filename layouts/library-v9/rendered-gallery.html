/* ============================================================
   SmartBuild Deck v5 — base.css
   References ONLY brand tokens (var(--sb-*)). build.py injects
   the :root token block from assets/tokens/tokens.json BEFORE
   this file, so no raw hex lives here — SWEEP checks for drift.
   Coordinate model: every slide authored in a FIXED 1280x720
   logical canvas (.stage), scaled to fit the viewport. Makes
   PDF/PPTX export viewport-independent.
============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; width: 100%; }

body {
  font-family: 'Montserrat', var(--sb-font-fallback);
  background: var(--sb-deck-bg);
  color: var(--sb-text-on-dark, #fff);
  overflow: hidden;
}
/* Letterbox rule (owner correction, 2026-08-13): the area around a scaled slide is
   ALWAYS the theme deck background, so text slides blend seamlessly. Full-bleed photo
   slides instead extend their own image to all four viewport corners via .slide-bleed
   (an ambient, blurred copy of the slide's background image injected by build.py behind
   the stage). Screen-only: exports capture the 1280x720 stage. */
.slide-bleed { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.slide-bleed img { filter: blur(36px) brightness(0.92); transform: scale(1.15); }
.slide-bleed::after { content: ""; position: absolute; inset: 0;
  background: var(--sb-ink, #0b0f1a); opacity: 0.55; }
@media print { .slide-bleed { display: none !important; } }

/* ---- Scroll-snap container ---- */
.deck {
  height: 100vh;
  height: 100svh;
  overflow-y: scroll;
  overflow-x: hidden;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
}

/* ---- One snap area per slide, centers the fixed canvas ---- */
.slide {
  position: relative;
  height: 100vh;
  height: 100svh;
  width: 100vw;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ---- The fixed 1280x720 authoring canvas ---- */
/* Ambient brand field (the signature): instead of a flat fill, every stage sits on a soft
   accent glow (top-right), a cool sky wash (bottom-left), and a faint blueprint grid — a nod
   to SmartBuild's structural/isometric world. The glow reads var(--sb-product-accent), so a
   product slide (e.g. smrt-E) is bathed in its own colour. All tints are color-mix over the
   theme's deck-bg token, so it adapts to light AND dark. Full-bleed photo slides cover it. */
.stage {
  position: relative;
  width: 1280px;
  height: 720px;
  flex: 0 0 auto;
  transform: scale(var(--deck-scale, 1));
  transform-origin: center center;
  overflow: hidden;
  background-color: var(--sb-deck-bg);
}

h1, h2, h3, h4, h5, h6 { text-transform: uppercase; }
.product-name, .no-caps { text-transform: none !important; }

/* Image slots: a photo fills its slot and crops the overflow instead of stretching. The slot
   (the authored container / the <img>'s own width+height) defines geometry; img-cover makes any
   resolved photo (owned or Unsplash) land formatted, never distorted. build.py adds this class
   to injected <img data-image> unless the author already set a class/object-fit. */
img.img-cover { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---- Theme-robust helpers (use these instead of hand-picking colours) ----
   Text over a photo/scrim sits on a fixed-dark backdrop, so it is white in BOTH themes.
   Wrap the overlay content in .on-media and every descendant reads white (labels stay sky). */
.on-media, .on-media * { color: #fff !important; }
.on-media .label, .on-media .accent { color: var(--sb-sky) !important; }
/* A card that stays visible in BOTH themes (the raw panel token sits too close to the dark bg). */
/* Cards lift off the ambient field with depth + a soft shadow (not a flat panel). */
.sb-card { background: var(--sb-panel); border: 1px solid var(--sb-border-subtle); border-radius: 6px;
  box-shadow: 0 6px 22px rgba(6,12,26,0.10); }
:root:not([data-theme="light"]) .sb-card {
  background: linear-gradient(158deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035));
  border-color: rgba(255,255,255,0.14); box-shadow: 0 12px 34px rgba(0,0,0,0.30); }
/* CTA button: accent fill, WHITE label, 6px radius — always. */
.cta-btn { display: inline-block; background: var(--sb-product-accent, var(--sb-sky)); color: #fff;
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 16px 34px; border-radius: 6px; }
.cta-btn * { color: #fff !important; }
/* Product name adopts the in-scope product accent (set --sb-product-accent on an ancestor). */
.product-name { color: var(--sb-product-accent, inherit); }
/* ...but inside a solid button or accent surface a product name must follow the
   button/surface text colour, not the accent (else e.g. pink name on a pink CTA). */
.cta .product-name, .on-accent .cta .product-name { color: inherit; }

/* ============================================================
   ELEMENT PRIMITIVES (authored inside .stage, in px)
============================================================ */
.hl        { font-weight: 900; line-height: 0.95; letter-spacing: -0.03em; color: var(--sb-title, #005491); }
/* Titles on a baby-blue (sky/accent) surface flip to white for contrast. */
.on-accent, .on-accent .hl, .hl.on-accent, .on-accent.hl { color: #ffffff; }
.subhead   { font-weight: 600; opacity: 0.6; letter-spacing: -0.01em; }
.label     { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sb-sky); }
/* Owner directive 2026-08-13: NO accent dashes/ticks on labels - removed .label::before. */
.body      { font-weight: 400; line-height: 1.6; color: var(--sb-body-on-dark, rgba(255,255,255,0.7)); }
.kpi-num   { font-weight: 900; line-height: 1; letter-spacing: -0.03em; color: var(--sb-product-accent, var(--sb-sky)); }
.kpi-label { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sb-body-on-dark, rgba(255,255,255,0.65)); margin-top: 8px; }
.cta {
  display: inline-block; background: var(--sb-sky); color: #ffffff; font-weight: 800;
  padding: 18px 44px; border-radius: var(--sb-radius-large); text-decoration: none;
  letter-spacing: 0.04em; box-shadow: 0 6px 24px rgba(0,178,227,0.28);
  align-self: flex-start; /* size to content even inside a flex-column stage */
  transition: transform var(--sb-anim-button), box-shadow var(--sb-anim-button);
}
.cta:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,178,227,0.4); }

.icon { width: 40px; height: 40px; stroke: var(--sb-sky); stroke-width: 2; fill: none; }

/* IP watermark — baked at BRAND for internal decks; subtle, non-obstructive */
.sb-watermark { position: absolute; left: 28px; bottom: 20px; z-index: 40; pointer-events: none;
  font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--sb-body-on-dark, rgba(255,255,255,0.28)); opacity: 0.45; }
.sb-watermark::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px;
  border-radius: 50%; background: var(--sb-sky); vertical-align: middle; opacity: 0.7; }

/* Brand mark in the footer of every slide (baked at BRAND). The background-image
   data URI is injected ONCE by build.py, so the 22 marks share one embed. */
.sb-footer-logo { position: absolute; left: 28px; bottom: 16px; width: 128px; height: 26px; z-index: 40;
  opacity: 0.9; pointer-events: none; background-repeat: no-repeat; background-position: left center; background-size: contain; }
/* Auto-contrast variants (deck.js picks per slide by sampling the bg behind the mark) */
/* SmartBuild logo has exactly TWO real renderings: WHITE (for dark backgrounds)
   and FULL-COLOUR (for light backgrounds). There is NO black logo. */
.sb-footer-logo.mono-white { filter: brightness(0) invert(1); }   /* dark/busy bg → white logo */
/* (no .mono-dark: a black SmartBuild logo does not exist; light bg keeps full-colour) */
/* Inline SmartBuild wordmark + badge: white on the dark theme, full-colour on light. */
:root[data-theme="dark"] img[data-logo="smartbuild"],
:root[data-theme="dark"] img[data-logo="smartbuild-badge"] { filter: brightness(0) invert(1); }
/* ...and WHITE on any fixed-dark backdrop regardless of the deck theme: inside an
   .on-media overlay (accent/navy panel or photo scrim), or on a stage the renderer
   marked as a full-bleed dark bleed. Fixed 2026-08-20: a light-theme deck with a
   dark photo cover was showing the FULL-COLOUR mark on near-black, which reads as a
   third (non-existent) logo rendering. There are only ever two: white and colour. */
.on-media img[data-logo="smartbuild"],
.on-media img[data-logo="smartbuild-badge"],
[data-bleed="dark"] img[data-logo="smartbuild"],
[data-bleed="dark"] img[data-logo="smartbuild-badge"],
img[data-logo="smartbuild"].mono-white,
img[data-logo="smartbuild-badge"].mono-white { filter: brightness(0) invert(1); }

/* Page number, one per slide (baked at BRAND) */
.sb-page-num { position: absolute; right: 30px; bottom: 18px; z-index: 40; pointer-events: none;
  font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: var(--sb-body-on-dark, rgba(255,255,255,0.55)); opacity: 0.8; }

/* RC7: review-only slide-index chip. Deliberately reads as review UI (not deck content):
   monospace, translucent dark pill, top-right. Present on EVERY slide (covers, sections,
   reference reuses) so a reviewer can always cite a slide. Injected by deck.js in review
   mode only — presentation.html never carries it. */
.sb-review-chip { position: absolute; top: 12px; right: 12px; z-index: 70; pointer-events: none;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  padding: 4px 9px; border-radius: 6px; color: #eaf2ff;
  background: rgba(11,30,58,0.72); border: 1px solid rgba(255,255,255,0.28);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25); }


/* Footer NO-GO ZONE: the bottom strip reserved for logo + page number.
   Content — especially bottom-anchored takeaway bands — must stop above it.
   Bottom-anchored full-bleed bands use .sb-safe-bottom to clear the chrome. */
:root { --sb-safe-bottom: 54px; }
.sb-safe-bottom { margin-bottom: var(--sb-safe-bottom); }

/* Full-bleed background image layer (BRAND) sits behind content (negative z within the stage's stacking context) */
.sb-bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; }
.sb-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(6,12,26,0.90), rgba(6,12,26,0.80)); }

/* Reveal animation */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity: 1; transform: none; }
.reveal-left  { opacity: 0; transform: translateX(-40px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal-left.visible  { opacity: 1; transform: none; }
.reveal-right { opacity: 0; transform: translateX(40px);  transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal-right.visible { opacity: 1; transform: none; }
.reveal-scale { opacity: 0; transform: scale(0.9);  transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1); }
.reveal-scale.visible { opacity: 1; transform: none; }
.reveal-hero  { opacity: 0; transform: translateY(60px) scale(0.97); transition: opacity 0.75s cubic-bezier(0.22,1,0.36,1), transform 0.75s cubic-bezier(0.22,1,0.36,1); }
.reveal-hero.visible  { opacity: 1; transform: none; }

/* ============================================================
   BLOOM PANELS (click any block to expand)
============================================================ */
.bloom-trigger {
  position: absolute; bottom: 40px; right: 56px; z-index: 10;
  background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 50px; padding: 14px 34px; font-family: inherit; font-size: 12px;
  font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
  color: #fff; transition: background var(--sb-anim-button), transform var(--sb-anim-button);
}
.bloom-trigger:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
.bloom-panel {
  position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  clip-path: circle(0% at var(--ox, 90%) var(--oy, 90%));
  transition: clip-path var(--sb-anim-bloom) cubic-bezier(0.4,0,0.2,1); pointer-events: none;
  background: var(--sb-panel-bg);
}
.bloom-panel.open { clip-path: circle(160% at var(--ox, 90%) var(--oy, 90%)); pointer-events: all; }
.bloom-inner { width: 88%; max-width: 1000px; padding: 48px; color: var(--sb-text-primary); }
/* Bloom content inherits the theme (light in light mode, dark in dark mode). */
/* Bloom-grid tile: a clickable card that lifts on hover (bloom_grid helper). */
.bloom-tile { cursor: pointer; transition: transform .16s, box-shadow .16s; }
.bloom-tile:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(6,12,26,0.12); }
.bloom-close {
  position: absolute; top: 28px; right: 28px; width: 44px; height: 44px; border-radius: 6px;
  background: var(--sb-panel); border: 1px solid var(--sb-border-subtle); color: var(--sb-text-primary);
  font-size: 18px; cursor: pointer; z-index: 60;
}

/* ============================================================
   FIXED UI (authoring chrome). Physically excluded from
   presentation.html by build.py; also hidden in :fullscreen.
============================================================ */
/* Numbered nav bubbles: a soft, rounded, scrollable pill. Horizontal PADDING gives the
   scaled active bubble room so it is never clipped on the sides (overflow-y:auto forces
   overflow-x to clip, so the track must be wider than the bubbles). */
#nav-dots { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 500; max-height: 84vh; overflow-y: auto; overflow-x: hidden; padding: 11px 9px; border-radius: 999px; background: rgba(10,18,32,0.32); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); scrollbar-width: none; }
#nav-dots::-webkit-scrollbar { display: none; }
.dot { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; font: 800 10px/1 'Montserrat', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; padding: 0; flex: none; transition: background 0.2s, transform 0.2s, box-shadow 0.2s; }
.dot:hover { background: rgba(255,255,255,0.32); transform: scale(1.12); }
.dot.active { background: var(--sb-sky); color: #fff; transform: scale(1.15); box-shadow: 0 0 0 3px rgba(0,178,227,0.28); }

/* Toolbar: ONE fixed rail as a horizontal row across the top-right. A row (not a column)
   keeps the tools clear of the vertically-centered nav dots on the right edge - the two
   never overlap. Buttons flow in flex so there are no hardcoded per-button tops and a
   removed/added button never leaves a gap. */
#ui-toolbar { position: fixed; top: 16px; right: 16px; z-index: 500; display: flex; flex-direction: row; gap: 8px; align-items: center; }
.uibtn {
  position: relative; width: 40px; height: 40px; border-radius: 8px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none;
  transition: background var(--sb-anim-button);
}
.uibtn:hover { background: rgba(255,255,255,0.14); }
.uibtn.active { background: var(--sb-sky); border-color: var(--sb-sky); color: var(--sb-ink); }
#text-toggle { font-weight: 800; }
/* Instant hover tooltip (label drops BELOW the tool) so every button names itself. */
.uibtn[data-tip]::after {
  content: attr(data-tip); position: absolute; top: calc(100% + 9px); right: 0; transform: translateY(-4px);
  background: #0d1829; color: #fff; font: 600 11px/1.35 'Montserrat', system-ui, sans-serif;
  padding: 7px 10px; border-radius: 6px; width: max-content; max-width: 230px; white-space: normal; text-align: left;
  border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none; transition: opacity .14s ease, transform .14s ease; z-index: 600;
}
.uibtn[data-tip]:hover::after { opacity: 1; transform: translateY(0); }

#save-menu {
  position: fixed; top: 64px; right: 16px; z-index: 499; min-width: 180px;
  background: var(--sb-panel-bg, #0d1829); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; overflow: hidden; opacity: 0; pointer-events: none; transform: translateY(-8px);
  transition: opacity 0.2s, transform 0.2s;
}
#save-menu.open { opacity: 1; pointer-events: all; transform: none; }
#save-menu button { display: flex; gap: 12px; width: 100%; padding: 14px 18px; background: none; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); font-family: inherit;
  font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-align: left; }
#save-menu button:hover { background: rgba(255,255,255,0.06); color: #fff; }

/* Export progress overlay */
#export-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(6,12,26,0.96); display: flex;
  flex-direction: column; align-items: center; justify-content: center; gap: 28px; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#export-overlay.visible { opacity: 1; pointer-events: all; }
.exp-spinner { width: 44px; height: 44px; border: 3px solid rgba(0,178,227,0.2); border-top-color: var(--sb-sky); border-radius: 50%; animation: exp-spin 0.8s linear infinite; }
@keyframes exp-spin { to { transform: rotate(360deg); } }
.exp-title { font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
#export-bar { width: 260px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
#export-fill { height: 100%; width: 0%; background: var(--sb-sky); transition: width 0.4s; }
/* Terminal states: the spinner stops and becomes a ✓ (done) or ! (error) so an export
   visibly ENDS instead of spinning forever. */
#export-overlay.done .exp-spinner, #export-overlay.error .exp-spinner { animation: none; position: relative; border-color: currentColor; }
#export-overlay.done .exp-spinner { color: var(--sb-sky); }
#export-overlay.error .exp-spinner { color: #ED1651; }
#export-overlay.done .exp-spinner::after { content: "\2713"; }
#export-overlay.error .exp-spinner::after { content: "!"; }
#export-overlay.done .exp-spinner::after, #export-overlay.error .exp-spinner::after {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 22px; color: currentColor; }
#export-overlay.done #export-fill { width: 100% !important; }
#export-overlay.error #export-fill { background: #ED1651; }

/* ============================================================
   REVIEW MODE + SELF-DESCRIBING PINS
============================================================ */
body.edit-mode .stage, body.edit-mode .stage * { cursor: crosshair !important; }

/* (Freehand drawing layer parked — pins carry precise element + coordinates.) */
.ann-pin { position: absolute; width: 26px; height: 26px; background: var(--sb-sky); border: 2px solid #fff;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg); cursor: pointer; z-index: 200;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.ann-pin span { transform: rotate(45deg); font-size: 10px; font-weight: 900; color: var(--sb-ink); }

#pin-popup { position: fixed; z-index: 600; width: 300px; background: var(--sb-panel-bg, #0d1829);
  border: 1px solid rgba(0,178,227,0.4); border-radius: 14px; padding: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.7); display: none; }
#pin-popup.visible { display: block; }
#pin-popup .target { font-size: 11px; color: var(--sb-sky); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; word-break: break-word; }
#pin-popup textarea { width: 100%; height: 88px; resize: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px; padding: 10px; outline: none; margin-bottom: 10px; }
.pin-btns { display: flex; gap: 8px; }
.pin-btns button { flex: 1; padding: 10px; border-radius: 7px; border: none; font-family: inherit; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
#pp-save { background: var(--sb-sky); color: var(--sb-ink); }
#pp-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

/* Slide-over panel base (review + sources share it) */
/* top:64 so an open panel sits BELOW the top-right toolbar row instead of over it */
.sidepanel { position: fixed; top: 64px; right: -380px; bottom: 0; width: 360px; z-index: 490;
  background: var(--sb-panel-bg-deep, #080f1e); border-left: 1px solid rgba(255,255,255,0.08);
  transition: right 0.35s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; }
.sidepanel.open { right: 0; }
.sidepanel header { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; }
.sidepanel header h3 { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.18em; color: var(--sb-sky); }
.sidepanel .panel-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 18px; cursor: pointer; }
.sidepanel .panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.sidepanel .panel-foot { padding: 16px 20px 24px; border-top: 1px solid rgba(255,255,255,0.08); }

.rn-empty { opacity: 0.4; padding: 24px; text-align: center; font-size: 13px; }

/* Notes are grouped under their slide, ordered top-to-bottom through the deck */
.review-group { margin-bottom: 18px; }
.rg-head { display: flex; align-items: center; gap: 8px; padding: 4px 2px 8px; }
.rg-head .rg-num { font-size: 10px; font-weight: 900; letter-spacing: 0.06em; color: var(--sb-ink); background: var(--sb-sky);
  border-radius: 5px; padding: 2px 6px; text-transform: uppercase; }
.rg-head .rg-topic { flex: 1; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rg-head .rg-count { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.5);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 1px 8px; }

.review-note { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.review-note.is-published { border-left: 2px solid var(--sb-sky); }
.review-note .rn-target { font-size: 11px; color: var(--sb-sky); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.review-note .rn-text { font-size: 14px; color: rgba(255,255,255,0.8); line-height: 1.5; }

/* Provenance chip + state badges (published / diverged / stale / removed) */
.rn-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.rn-prov { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.04em;
  color: rgba(255,255,255,0.6); background: rgba(0,178,227,0.08); border: 1px solid rgba(0,178,227,0.25);
  border-radius: 6px; padding: 2px 7px; }
.rn-prov-tag { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sb-sky); }
.rn-badge { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; border-radius: 6px; padding: 2px 7px; }
.rn-badge.diverged { color: var(--sb-ink); background: var(--sb-copper); }        /* amber: edits leave master */
.rn-badge.stale    { color: #fff; background: rgba(237,22,81,0.85); }             /* pink alert: content moved under the pin */
.rn-badge.removed  { color: #fff; background: var(--sb-pink); }

.panel-cta { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--sb-sky), #0067a0); border: none; border-radius: 10px;
  color: #fff; font-family: inherit; font-weight: 900; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; }
.panel-cta:disabled { opacity: 0.35; cursor: not-allowed; }

/* Pin popup: published-content warning line */
#pin-popup .pp-prov { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11px;
  color: rgba(255,255,255,0.7); background: rgba(0,178,227,0.08); border: 1px solid rgba(0,178,227,0.25); border-radius: 8px; padding: 7px 9px; }
#pin-popup .pp-prov-tag { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sb-sky); }
#pin-popup .pp-badge.diverged { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--sb-ink); background: var(--sb-copper); border-radius: 6px; padding: 2px 7px; }

/* Marker state: published pins ringed; diverged amber; stale pink */
.ann-pin.published { box-shadow: 0 0 0 3px rgba(0,178,227,0.35), 0 2px 12px rgba(0,0,0,0.6); }
.ann-pin.diverged { background: var(--sb-copper); }
.ann-pin.stale { background: var(--sb-pink); }

/* Sources rows */
.src-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
.src-row .src-kind { color: var(--sb-sky); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
.src-row a { color: rgba(255,255,255,0.7); word-break: break-all; }

/* ============================================================
   FULLSCREEN + PRINT — hide all chrome
============================================================ */
:fullscreen #nav-dots, :fullscreen #ui-toolbar, :fullscreen .uibtn, :fullscreen #save-menu, :fullscreen .sidepanel,
:fullscreen #pin-popup, :fullscreen .ann-pin { display: none !important; }

@media print {
  @page { size: 1280px 720px; margin: 0; }
  .deck { overflow: visible; scroll-snap-type: none; height: auto; }
  #nav-dots, #ui-toolbar, .uibtn, #save-menu, .sidepanel, #pin-popup, .ann-pin, #export-overlay, .bloom-trigger { display: none !important; }
  .bloom-panel { display: none !important; }
  .slide { height: 720px; page-break-after: always; }
  .stage { transform: none; }
  .reveal, .reveal-left, .reveal-right, .reveal-scale, .reveal-hero { opacity: 1 !important; transform: none !important; }
}

/* ============================================================
   LIGHT-MODE REVIEW CHROME (cycle-5): every control and note UI
   must clear contrast on a light deck — buttons, save menu, pin
   markers, pin popup, panels, nav dots, slide chip.
============================================================ */
html:not([data-theme="dark"]) .uibtn {
  background: #dbe6f2; color: #0b2a4a; border: 1px solid #b7c9dd; }
html:not([data-theme="dark"]) .uibtn:hover { background: #c8d9ea; }
html:not([data-theme="dark"]) .uibtn.active { background: #0b2a4a; color: #fff; }
html:not([data-theme="dark"]) #nav-dots .dot { background: #d3deeb; color: #005491; }
html:not([data-theme="dark"]) #nav-dots .dot.active { background: #0b6ea8; color: #fff; }
html:not([data-theme="dark"]) #save-menu {
  background: #ffffff; border: 1px solid #b7c9dd; box-shadow: 0 10px 30px rgba(11,42,74,.18); }
html:not([data-theme="dark"]) #save-menu button { color: #0b2a4a; }
html:not([data-theme="dark"]) #save-menu button:hover { background: #e3edf7; }
html:not([data-theme="dark"]) #pin-popup {
  background: #ffffff; border: 1px solid #b7c9dd; color: #0b2a4a;
  box-shadow: 0 14px 40px rgba(11,42,74,.22); }
html:not([data-theme="dark"]) #pin-popup textarea {
  background: #f2f6fb; color: #0b2a4a; border: 1px solid #b7c9dd; }
html:not([data-theme="dark"]) #pin-popup button { color: #0b2a4a; }
html:not([data-theme="dark"]) .ann-pin { border-color: #ffffff; box-shadow: 0 2px 10px rgba(11,42,74,.35); }
html:not([data-theme="dark"]) .sidepanel {
  background: #ffffff; color: #0b2a4a; border-left: 1px solid #b7c9dd; }
html:not([data-theme="dark"]) .sidepanel h3 { color: #0b2a4a; }
html:not([data-theme="dark"]) .slide-chip { background: #0b2a4a; color: #fff; }
html:not([data-theme="dark"]) .sidepanel, html:not([data-theme="dark"]) .sidepanel * { color: #23415f; }
html:not([data-theme="dark"]) .sidepanel h3, html:not([data-theme="dark"]) .sidepanel b { color: #0b2a4a; }
html:not([data-theme="dark"]) .panel-cta, html:not([data-theme="dark"]) #copy-notes-btn {
  background: #0b6ea8 !important; color: #ffffff !important; }

/* ============================================================
   NOTES-EVERYWHERE (Rowan 2026-07-04): the pin/notes feature ships in EVERY
   artifact. In presentation mode it stays SUBTLE — low-opacity chrome that
   wakes on hover — and the slide chip carries the pipeline stage
   (e.g. "s07/35 · REFINE 3/5"); the orange cover sticky is gone for good.
============================================================ */
body.mode-presentation .uibtn, body.mode-presentation .sb-review-chip { opacity: 0.22; transition: opacity .25s; }
body.mode-presentation .uibtn:hover, body.mode-presentation .uibtn.active,
body.mode-presentation:hover .sb-review-chip { opacity: 0.9; }
body.mode-presentation.edit-mode .uibtn, body.mode-presentation.edit-mode .sb-review-chip { opacity: 1; }

/* ============================================================
   PER-SLIDE VARIANT CHOICE + SLIDE BOARD  (review-only, Rowan 2026-07-06)
   Reference slides carry BOTH a .ref-light and .ref-dark render inside the
   .stage; a single global html[data-theme] normally flips all of them at once.
   These rules let the reviewer pin a SPECIFIC variant as the "main" version of
   an INDIVIDUAL slide, overriding the global theme for that slide only. The
   choice is recorded and round-tripped to Claude via the review payload.
============================================================ */
/* Reference dual-render toggle base rules (needed when a verbatim slide is REUSED into a
   fresh deck; rendered reference decks also carry these in their own head). Deck-wide theme
   shows one variant; the per-slide override below wins over it. */
.ref-variant { position: absolute; inset: 0; }
html[data-theme="dark"] .ref-light { visibility: hidden; }
html:not([data-theme="dark"]) .ref-dark { visibility: hidden; }

/* Per-slide override beats the global html[data-theme] .ref-* rules (!important). */
.slide[data-variant="light"] .ref-dark  { visibility: hidden  !important; }
.slide[data-variant="light"] .ref-light { visibility: visible !important; }
.slide[data-variant="dark"]  .ref-light { visibility: hidden  !important; }
.slide[data-variant="dark"]  .ref-dark  { visibility: visible !important; }
/* Same override applied inside board thumbnails (cloned stages live outside .slide). */
.board-thumb[data-variant="light"] .ref-dark  { visibility: hidden  !important; }
.board-thumb[data-variant="light"] .ref-light { visibility: visible !important; }
.board-thumb[data-variant="dark"]  .ref-light { visibility: hidden  !important; }
.board-thumb[data-variant="dark"]  .ref-dark  { visibility: visible !important; }

/* ---- board toggle button (flows in the toolbar rail) ---- */
body.mode-presentation #board-toggle { display: none !important; }

/* ---- direct-text-edit toggle + editable affordance (review only) ---- */
body.mode-presentation #text-toggle { display: none !important; }
body.text-edit-mode [data-te][contenteditable] {

/* ---- inline per-slide variant toggle (top-left of each stage, edit-mode only) ---- */
.sb-vtoggle {
  position: absolute; top: 10px; left: 10px; z-index: 60; display: none;
  gap: 2px; padding: 3px; border-radius: 8px; font-family: 'Montserrat', sans-serif;
  background: rgba(6,18,34,0.82); border: 1px solid rgba(255,255,255,0.18);

  position: absolute; top: 10px; right: 10px; z-index: 60; display: none;

  font-size: 14px; cursor: pointer; color: #fff; font-family: 'Montserrat', sans-serif;
  background: rgba(180,36,36,0.82); border: 1px solid rgba(255,255,255,0.22);

.sb-delbtn:hover { background: rgba(210,44,44,0.98); }

============================================================ */

}
#slide-board.open { display: flex; }
html:not([data-theme="dark"]) #slide-board { background: rgba(238,243,250,0.98); color: #16324f; }
.board-head {

html:not([data-theme="dark"]) .board-head { border-bottom-color: #cdd9e8; }
.board-head h2 { font-size: 14px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sb-sky); }
.board-head .board-sub { font-size: 12px; opacity: 0.7; }
.board-head .board-spacer { flex: 1; }
.board-btn {
  border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: inherit;
  font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.03em; cursor: pointer;
  padding: 9px 15px; border-radius: 8px; transition: background .18s, border-color .18s;
}
.board-btn:hover { background: rgba(255,255,255,0.14); }
.board-btn.primary { background: var(--sb-sky); border-color: var(--sb-sky); color: var(--sb-ink); }
.board-btn.primary:hover { filter: brightness(1.08); }
html:not([data-theme="dark"]) .board-btn { border-color: #b7c9dd; background: #ffffff; }
html:not([data-theme="dark"]) .board-btn:hover { background: #e3edf7; }
.board-scroll { flex: 1; overflow-y: auto; padding: 16px 26px 28px; }
.board-section-title {

}

.board-thumb {

.board-card.is-removed .board-thumb { filter: grayscale(0.8) brightness(0.5); }

}
.board-foot { display: flex; align-items: center; gap: 8px; padding: 9px 10px; }

.board-legend {

.board-legend b { opacity: 1; font-weight: 800; }
html:not([data-theme="dark"]) .board-legend { border-bottom-color: #dbe4ef; }

/* delete / restore — a clear ✕ in the card's top-right corner (universal remove) */
.board-del {

  border: 1px solid rgba(255,255,255,0.22); background: rgba(6,18,34,0.8); color: #ff8f8f; cursor: pointer;

.board-del:hover { background: rgba(210,44,44,0.98); color: #fff; transform: scale(1.08); }
.board-del.is-restore { color: var(--sb-sky); }
.board-del.is-restore:hover { background: var(--sb-sky); color: var(--sb-ink); }
html:not([data-theme="dark"]) .board-del { background: #ffffff; border-color: #d8b3b3; color: #c23b3b; }
html:not([data-theme="dark"]) .board-del:hover { background: #d22c2c; color: #fff; }
html:not([data-theme="dark"]) .board-del.is-restore { color: #0b6ea8; }
html:not([data-theme="dark"]) .board-del.is-restore:hover { background: #0b6ea8; color: #fff; }

.board-mode {
  position: absolute; bottom: 8px; right: 8px; z-index: 5; display: inline-flex; gap: 2px;
  padding: 3px; border-radius: 999px; background: rgba(6,18,34,0.8);
  border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px);

.board-card.is-removed .board-mode { display: none; }
.board-mode button {

  width: 27px; height: 23px; border-radius: 999px; font-size: 13px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; transition: background .16s, color .16s;
}
.board-mode button:hover { color: #fff; }
.board-mode button.active { background: var(--sb-sky); color: var(--sb-ink); }
.board-card.is-removed .board-topic { text-decoration: line-through; opacity: 0.5; }

/* notes-open: shrink each slide so the WHOLE slide shows beside the notes panel */
:root { --notes-w: 380px; }
body.notes-open .slide { width: calc(100vw - var(--notes-w)); }

#sb-format-bar { position: fixed; z-index: 700; display: flex; align-items: center; gap: 5px;

#sb-format-bar .fb-btn:hover { background: rgba(255,255,255,0.2); }

  cursor: pointer; padding: 0; }
#sb-format-bar .fb-sw:hover { transform: scale(1.15); }
#sb-format-bar .fb-hl { border-radius: 4px; }

/* make edited blocks show a subtle affordance in text-edit mode */

<script>
(function(){
 var KEY='sb-tpl-lib-v1';
 var store={deleted:[],notes:{},mass:''};
 try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s){store.deleted=s.deleted||[];store.notes=s.notes||{};store.mass=s.mass||'';} }catch(e){}
 // Match the deck's final render state without clobbering positioning transforms.
 document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-scale,.reveal-hero').forEach(function(e){e.classList.add('visible');});
 var canSave=true; try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){canSave=false;}
 function save(){ if(!canSave)return; try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} }
 function updateCount(){
   var vis=document.querySelectorAll('.card:not(.is-deleted)').length;
   var c=document.getElementById('count'); if(c)c.textContent=vis;
   document.querySelectorAll('.famhead').forEach(function(h){
     var fam=h.getAttribute('data-fam');
     h.querySelector('.famn').textContent=document.querySelectorAll('.card[data-id^="'+fam+'-"]:not(.is-deleted)').length;
   });
   var sn=document.getElementById('savenote'); if(sn) sn.textContent = canSave ? 'saved' : 'NOT saved (localStorage blocked)';
 }
 document.querySelectorAll('.card').forEach(function(card){
   var id=card.getAttribute('data-id');
   if(store.deleted.indexOf(id)>=0) card.classList.add('is-deleted');
   var nb=card.querySelector('.notebox');
   if(store.notes[id]){ nb.value=store.notes[id]; nb.classList.add('has'); }
 });
 var massEl=document.getElementById('mass'); if(massEl) massEl.value=store.mass;
 updateCount();
 document.querySelectorAll('.notebox').forEach(function(nb){
   nb.addEventListener('input',function(){
     var id=nb.getAttribute('data-id'), v=nb.value.trim();
     if(v){store.notes[id]=v;nb.classList.add('has');}else{delete store.notes[id];nb.classList.remove('has');}
     save();
   });
 });
 if(massEl) massEl.addEventListener('input',function(){store.mass=massEl.value;save();});
 document.querySelectorAll('.delbtn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
   var card=b.closest('.card'),id=card.getAttribute('data-id');
   if(store.deleted.indexOf(id)<0)store.deleted.push(id); card.classList.add('is-deleted'); save(); updateCount();});});
 document.querySelectorAll('.restorebtn').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();
   var card=b.closest('.card'),id=card.getAttribute('data-id');
   store.deleted=store.deleted.filter(function(x){return x!==id;}); card.classList.remove('is-deleted'); save(); updateCount();});});
 var modal=document.getElementById('modal');
 document.querySelectorAll('.frame').forEach(function(f){f.addEventListener('click',function(e){
   if(e.target.classList.contains('delbtn')||e.target.classList.contains('restorebtn'))return;
   var box=document.createElement('div'); box.className='mframe';
   box.appendChild(f.querySelector('.stage').cloneNode(true));
   modal.innerHTML=''; modal.appendChild(box); modal.classList.add('open');});});
 modal.addEventListener('click',function(e){ if(e.target===modal) modal.classList.remove('open'); });
 document.getElementById('editbtn').addEventListener('click',function(){document.body.classList.toggle('edit');this.classList.toggle('on');});
 document.getElementById('showdel').addEventListener('click',function(){document.body.classList.toggle('show-deleted');this.classList.toggle('on');});
 document.getElementById('themebtn').addEventListener('click',function(){
   var r=document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme')==='light'?'dark':'light');});
 function payload(){
   var L=['SmartBuild Rendered Template Library - change requests',''];
   var mass=(store.mass||'').trim();
   L.push('## MASS CHANGE (apply to ALL templates):'); L.push(mass?mass:'(none)'); L.push('');
   var ids=Object.keys(store.notes).filter(function(id){return (store.notes[id]||'').trim();}).sort();
   L.push('## PER-TEMPLATE CHANGES ('+ids.length+'):'); if(!ids.length)L.push('(none)');
   ids.forEach(function(id){var c=document.querySelector('.card[data-id="'+id+'"]');
     L.push('- '+id+' ('+(c?c.getAttribute('data-rend'):'')+' | '+(c?c.getAttribute('data-title'):'')+'): '+store.notes[id].trim());});
   L.push('');
   L.push('## DELETE THESE ('+store.deleted.length+') - remove renderer + catalog entry:'); if(!store.deleted.length)L.push('(none)');
   store.deleted.slice().sort().forEach(function(id){var c=document.querySelector('.card[data-id="'+id+'"]');
     L.push('- '+id+' ('+(c?c.getAttribute('data-rend'):'')+')');});
   return L.join('\n');
 }
 var cm=document.getElementById('copymodal'), ct=document.getElementById('copytext');
 document.getElementById('copybtn').addEventListener('click',function(){ct.value=payload();cm.classList.add('open');ct.focus();ct.select();try{navigator.clipboard.writeText(ct.value);}catch(e){}});
 document.getElementById('docopy').addEventListener('click',function(){ct.focus();ct.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}try{navigator.clipboard.writeText(ct.value);ok=true;}catch(e){}this.textContent=ok?'Copied!':'Select + Cmd/Ctrl+C';var b=this;setTimeout(function(){b.textContent='Copy';},1500);});
 document.getElementById('closecopy').addEventListener('click',function(){cm.classList.remove('open');});
 cm.addEventListener('click',function(e){if(e.target===cm)cm.classList.remove('open');});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'){modal.classList.remove('open');cm.classList.remove('open');}});
})();
