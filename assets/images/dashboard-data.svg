<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SmartBuild — owner analytics dashboard with real-time project intelligence">
  <defs>
    <linearGradient id="dd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1526"/>
      <stop offset="1" stop-color="#060c1a"/>
    </linearGradient>
    <linearGradient id="dd-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00B2E3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00B2E3"/>
    </linearGradient>
    <pattern id="dd-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#76A3B2" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#dd-bg)"/>
  <rect width="1600" height="900" fill="url(#dd-grid)"/>

  <!-- KPI tiles -->
  <g>
    <rect x="120" y="120" width="360" height="150" rx="14" fill="#0d1829" stroke="#00B2E3" stroke-opacity="0.4"/>
    <rect x="150" y="150" width="150" height="14" rx="7" fill="#76A3B2" fill-opacity="0.5"/>
    <rect x="150" y="184" width="220" height="40" rx="8" fill="#00B2E3"/>
    <rect x="520" y="120" width="360" height="150" rx="14" fill="#0d1829" stroke="#E17126" stroke-opacity="0.4"/>
    <rect x="550" y="150" width="150" height="14" rx="7" fill="#76A3B2" fill-opacity="0.5"/>
    <rect x="550" y="184" width="180" height="40" rx="8" fill="#E17126"/>
  </g>

  <!-- line/area trend -->
  <g>
    <rect x="120" y="320" width="760" height="460" rx="16" fill="#0d1829" stroke="#76A3B2" stroke-opacity="0.25"/>
    <polyline points="170,700 300,610 430,650 560,500 690,540 820,400" fill="none" stroke="#00B2E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="170,700 300,610 430,650 560,500 690,540 820,400 820,740 170,740" fill="#00B2E3" fill-opacity="0.12"/>
    <g fill="#ED1651"><circle cx="560" cy="500" r="8"/><circle cx="820" cy="400" r="8"/></g>
  </g>

  <!-- bar column panel -->
  <g>
    <rect x="920" y="320" width="560" height="460" rx="16" fill="#0d1829" stroke="#76A3B2" stroke-opacity="0.25"/>
    <g>
      <rect x="980" y="560" width="70" height="160" rx="6" fill="url(#dd-bar)"/>
      <rect x="1080" y="480" width="70" height="240" rx="6" fill="url(#dd-bar)"/>
      <rect x="1180" y="520" width="70" height="200" rx="6" fill="url(#dd-bar)"/>
      <rect x="1280" y="420" width="70" height="300" rx="6" fill="url(#dd-bar)"/>
      <rect x="1380" y="500" width="70" height="220" rx="6" fill="#E17126"/>
    </g>
  </g>
</svg>
