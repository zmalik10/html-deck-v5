<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SmartBuild — construction site at scale, cranes over a rising steel frame">
  <defs>
    <linearGradient id="cc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="0.55" stop-color="#060c1a"/>
      <stop offset="1" stop-color="#03060f"/>
    </linearGradient>
    <linearGradient id="cc-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00B2E3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00B2E3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cc-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#00B2E3" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#cc-sky)"/>
  <rect width="1600" height="900" fill="url(#cc-grid)"/>
  <circle cx="1240" cy="230" r="520" fill="url(#cc-glow)"/>

  <!-- rising steel frame -->
  <g stroke="#76A3B2" stroke-width="6" fill="none" stroke-opacity="0.9">
    <rect x="180" y="440" width="420" height="380"/>
    <line x1="180" y1="540" x2="600" y2="540"/>
    <line x1="180" y1="640" x2="600" y2="640"/>
    <line x1="180" y1="740" x2="600" y2="740"/>
    <line x1="320" y1="440" x2="320" y2="820"/>
    <line x1="460" y1="440" x2="460" y2="820"/>
    <line x1="180" y1="440" x2="320" y2="540"/>
    <line x1="320" y1="540" x2="460" y2="440"/>
    <line x1="460" y1="540" x2="600" y2="440"/>
  </g>

  <!-- tower crane -->
  <g stroke="#E17126" stroke-width="8" fill="none" stroke-linecap="round">
    <line x1="980" y1="820" x2="980" y2="180"/>
    <line x1="940" y1="820" x2="1020" y2="820"/>
    <line x1="620" y1="200" x2="1300" y2="200"/>
    <line x1="980" y1="180" x2="700" y2="200"/>
    <line x1="980" y1="180" x2="1220" y2="200"/>
    <line x1="1220" y1="200" x2="1220" y2="330"/>
  </g>
  <g fill="#E17126">
    <rect x="1205" y="330" width="30" height="26" rx="3"/>
  </g>
  <line x1="1220" y1="356" x2="1220" y2="470" stroke="#E17126" stroke-width="4"/>
  <rect x="1188" y="470" width="64" height="30" rx="4" fill="#00B2E3"/>

  <!-- foreground silhouette -->
  <path d="M0 820 L1600 820 L1600 900 L0 900 Z" fill="#03060f"/>
  <g fill="#0d1829">
    <rect x="60" y="720" width="120" height="100"/>
    <rect x="1360" y="680" width="150" height="140"/>
    <rect x="1240" y="760" width="90" height="60"/>
  </g>
</svg>
