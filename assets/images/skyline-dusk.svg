<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SmartBuild — city skyline at dusk, ready to build">
  <defs>
    <linearGradient id="sk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.6" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#123a52"/>
    </linearGradient>
    <linearGradient id="sk-glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00B2E3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00B2E3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sk-sky)"/>
  <circle cx="800" cy="900" r="640" fill="url(#sk-glow)"/>
  <circle cx="1180" cy="240" r="70" fill="#E17126" fill-opacity="0.85"/>

  <!-- far skyline -->
  <g fill="#0d1829">
    <rect x="60" y="560" width="90" height="340"/>
    <rect x="170" y="500" width="70" height="400"/>
    <rect x="260" y="600" width="110" height="300"/>
    <rect x="390" y="460" width="80" height="440"/>
    <rect x="1150" y="540" width="90" height="360"/>
    <rect x="1260" y="600" width="120" height="300"/>
    <rect x="1400" y="500" width="80" height="400"/>
  </g>

  <!-- near skyline -->
  <g fill="#06101f">
    <rect x="480" y="400" width="120" height="500"/>
    <rect x="620" y="320" width="100" height="580"/>
    <rect x="740" y="240" width="130" height="660"/>
    <rect x="890" y="360" width="110" height="540"/>
    <rect x="1020" y="440" width="120" height="460"/>
  </g>

  <!-- lit windows -->
  <g fill="#00B2E3" fill-opacity="0.75">
    <rect x="770" y="290" width="16" height="22"/><rect x="800" y="290" width="16" height="22"/><rect x="830" y="290" width="16" height="22"/>
    <rect x="770" y="340" width="16" height="22"/><rect x="830" y="340" width="16" height="22"/>
    <rect x="650" y="380" width="14" height="20"/><rect x="680" y="380" width="14" height="20"/>
    <rect x="650" y="430" width="14" height="20"/>
    <rect x="920" y="410" width="14" height="20"/><rect x="950" y="410" width="14" height="20"/>
    <rect x="920" y="460" width="14" height="20"/>
  </g>
  <g fill="#E17126" fill-opacity="0.8">
    <rect x="800" y="340" width="16" height="22"/>
    <rect x="680" y="430" width="14" height="20"/>
    <rect x="950" y="460" width="14" height="20"/>
  </g>
</svg>
